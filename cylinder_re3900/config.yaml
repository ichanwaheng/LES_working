# Flow past a circular cylinder at Re = 3900
# Staggered-grid PISO + Smagorinsky LES (self-contained under cylinder_re3900/)

simulation:
  name: cylinder_re3900
  output_dir: cylinder_re3900/output
  save_interval: 50
  plot_interval: 50
  gif_fps: 8

# Re = U * D / nu = 3900  →  with U=1, D=1: nu = 1/3900
physical:
  rho: 1.0
  U_inf: 1.0
  D: 1.0
  Re: 3900

domain:
  # x: inlet → outlet; cylinder centre at (cx, cy)
  L: 20.0          # streamwise length (~20 D)
  W: 12.0          # cross-stream (~12 D)
  H: 3.1415926535  # span ≈ π D (classic LES span)
  cx: 5.0          # cylinder centre x
  cy: 6.0          # cylinder centre y (mid-channel)

grid:
  nx: 128
  ny: 80
  nz: 24

time:
  dt: 0.002
  t_end: 20.0      # convective times (~ U t / D)
  cfl_max: 0.5

les:
  enabled: true
  Cs: 0.1
  piso_correctors: 2

# Coarse override used by: python run.py --quick
quick:
  nx: 48
  ny: 32
  nz: 8
  dt: 0.005
  t_end: 2.0
  save_interval: 20
  plot_interval: 10   # denser frames for wake GIF
