# Laminar flow past a circular cylinder at Re = 150
# NASA GRC Wind-US validation Study #1 analogue (2-D incompressible PISO)
# https://www.grc.nasa.gov/www/wind/valid/lamcyl/Study1_files/Study1.html

simulation:
  name: cylinder_re150
  output_dir: cylinder_re150/output
  save_interval: 50
  plot_interval: 50
  gif_fps: 8

# Re = U * D / nu = 150  →  with U=1, D=1: nu = 1/150
physical:
  rho: 1.0
  U_inf: 1.0
  D: 1.0
  Re: 150

domain:
  # x: inlet → outlet; cylinder centre at (cx, cy)
  L: 24.0          # streamwise length (~24 D)
  W: 12.0          # cross-stream (~12 D)
  cx: 6.0          # cylinder centre x
  cy: 6.0          # cylinder centre y (mid-channel)

# Mesh is derived from BL theory — do NOT prescribe nx, ny.
# 1) δ = D/√Re
# 2) n_bl cells in the BL (input, typical 15–30)
# 3) growth rate (input, typical 1.05–1.2)
# 4) Δ_k = Δ₁ * growth^(k-1) spanning δ
# 5) outer fluid cell size = Δ_max (largest BL cell), unless h_far override
mesh:
  n_bl: 12
  growth: 1.20
  # h_far omitted → outer spacing = Δ_max (theory). Expect O(10^6) cells.
  # For a lighter production mesh you may set e.g. h_far: 0.05

time:
  dt: 0.002
  t_end: 100.0
  cfl_max: 0.5

solver:
  piso_correctors: 2
  conv_scheme: central

validation:
  Cd_exp: 1.78
  St_exp_lo: 0.179
  St_exp_hi: 0.182
  settle_fraction: 0.60

# Coarse override used by: python run.py --quick
# h_far > Δ_max only for a fast smoke test (outer domain coarsened)
quick:
  n_bl: 8
  growth: 1.25
  h_far: 0.10          # > Δ_max: coarsens only the outer domain for smoke tests
  dt: 0.0003           # limited by Δ₁ (wall) CFL on stretched mesh
  t_end: 2.0
  save_interval: 100
  plot_interval: 100
