# Laminar flow past a circular cylinder at Re = 150
# NASA GRC Wind-US validation Study #1 analogue (2-D incompressible PISO)
# https://www.grc.nasa.gov/www/wind/valid/lamcyl/Study1_files/Study1.html

simulation:
  name: cylinder_re150
  output_dir: cylinder_re150/output
  save_interval: 50
  plot_interval: 50
  gif_fps: 8

# Re = U * D / nu = 150  →  with U=1, D=1: nu = 1/150
physical:
  rho: 1.0
  U_inf: 1.0
  D: 1.0
  Re: 150

domain:
  # x: inlet → outlet; cylinder centre at (cx, cy)
  L: 24.0          # streamwise length (~24 D)
  W: 12.0          # cross-stream (~12 D)
  cx: 6.0          # cylinder centre x
  cy: 6.0          # cylinder centre y (mid-channel)

grid:
  nx: 240
  ny: 120

time:
  dt: 0.003
  t_end: 100.0     # convective times — need several shedding periods
  cfl_max: 0.5

solver:
  piso_correctors: 2
  # central: low numerical diffusion (needed for Re=150 shedding)
  # upwind: more stable but damps vortices on coarse grids
  conv_scheme: central

validation:
  # Experimental / literature targets cited by NASA Study #1
  Cd_exp: 1.78
  St_exp_lo: 0.179
  St_exp_hi: 0.182
  # Average forces after this fraction of t_end
  settle_fraction: 0.60

# Coarse override used by: python run.py --quick
quick:
  nx: 120
  ny: 60
  dt: 0.008
  t_end: 40.0
  save_interval: 25
  plot_interval: 25
